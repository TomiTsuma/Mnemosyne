name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  CC: gcc-13
  CXX: g++-13

jobs:
  build:
    name: ${{ matrix.os }}-clang++-23-${{ matrix.sanitizers && 'sanitize' || 'release' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
        sanitize: [false, true]
        include:
          - os: ubuntu-24.04
            sanitize: true
          - os: ubuntu-24.04
            sanitize: false
          - os: macos-14
            sanitize: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc-13 g++-13 libfmt-dev libzstd-dev liblz4-dev libatomic-ops-dev

      - name: Install dependencies (macOS)
        if: matrix.os == 'macos-14'
        run: |
          brew install cmake ninja fmt lz4 zstd

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=${{ matrix.sanitize && 'RelWithDebInfo' || 'Release' }} \
            -DENABLE_TESTS=ON \
            -DENABLE_BENCHMARKS=OFF \
            ${{ matrix.sanitize && '-DENABLE_SANITIZERS=ON' || '' }}

      - name: Build
        run: cmake --build build -j$(nproc || sysctl -n hw.ncpu)

      - name: Run tests
        if: always()
        working-directory: build
        run: ctest --output-on-failure -j$(nproc || sysctl -n hw.ncpu)

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.sanitize && 'sanitize' || 'release' }}
          path: build/Testing/

  lint:
    name: clang-tidy
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install clang-tidy
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tidy-18

      - name: Configure for tidy
        run: |
          cmake -B build -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Run clang-tidy
        run: |
          find src -name '*.cpp' -exec clang-tidy-18 \
            --config-file=.clang-tidy \
            --header-filter='src/.*' \
            --compile-commands-dir=build \
            {} +
        continue-on-error: true
