<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mnemo</title>
<link rel="icon" href="/favicon.ico">
<style>
  @font-face {
    font-family: 'Nunito';
    src: url('fonts/Nunito-Variable.ttf') format('truetype');
    font-weight: 200 1000;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: 'Nunito';
    src: url('fonts/Nunito-Italic-Variable.ttf') format('truetype');
    font-weight: 200 1000;
    font-style: italic;
    font-display: swap;
  }

  :root {
    --bg: #0f0f1a;
    --surface: #1a1325;
    --surface2: #1d0e3d;
    --surface3: #2f1f3d;
    --border: #3a2550;
    --text: #f0eef8;
    --text-dim: #9ca3af;
    --accent: #1f9cfe;
    --accent-dim: #2a43a9;
    --green: #22c55e;
    --green-dim: #24a148;
    --red: #ef4444;
    --yellow: #f59e0b;
    --radius: 8px;
    --mono: 'Consolas', 'SFMono-Regular', ui-monospace, 'Fira Code', monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: 'Nunito', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
  }
  button, input { font-family: inherit; }

  .app {
    display: flex;
    flex-direction: column;
    height: 100vh;
  }

  /* ── Top bar ── */
  .topbar {
    height: 52px;
    flex: none;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 17px;
    font-weight: 800;
    color: var(--accent);
  }
  .brand-logo {
    width: 26px;
    height: 26px;
    object-fit: contain;
    flex: none;
  }
  .brand .sub {
    color: var(--text-dim);
    font-weight: 600;
    font-size: 12px;
    padding: 2px 8px;
    border: 1px solid var(--border);
    border-radius: 999px;
  }
  .topbar-right {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .pill {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 700;
    color: var(--text-dim);
    background: var(--surface2);
    border: 1px solid var(--border);
    padding: 5px 10px;
    border-radius: 999px;
  }
  .pill .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--green);
  }
  .pill .dot.off { background: var(--red); }
  .pill.count .val { color: var(--accent); }
  .icon-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 30px; height: 30px;
    border-radius: 7px;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text-dim);
    cursor: pointer;
    font-size: 14px;
    transition: all 0.15s;
  }
  .icon-btn:hover { color: var(--text); background: var(--surface3); }
  .btn {
    padding: 8px 18px;
    border: none;
    border-radius: 7px;
    font-family: inherit;
    font-size: 13px;
    font-weight: 800;
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .btn-run {
    background: var(--green);
    color: #05130c;
  }
  .btn-run:hover { background: var(--green-dim); }
  .btn-run:active { transform: scale(0.97); }
  .btn-secondary {
    background: var(--surface2);
    color: var(--text-dim);
    border: 1px solid var(--border);
    font-weight: 600;
  }
  .btn-secondary:hover { background: var(--surface3); color: var(--text); }

  /* ── Body: sidebar + main ── */
  .body {
    flex: 1;
    display: flex;
    overflow: hidden;
  }

  .sidebar {
    width: 240px;
    flex: none;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .sidebar-header {
    padding: 10px 14px 6px;
    font-size: 11px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    color: var(--text-dim);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .sidebar-search {
    margin: 0 10px 8px;
    padding: 6px 10px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 12px;
    color: var(--text);
    outline: none;
  }
  .sidebar-search:focus { border-color: var(--accent); }
  .tree-scroll {
    flex: 1;
    overflow-y: auto;
    padding-bottom: 8px;
  }
  .tree-node { user-select: none; }
  .tree-row {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 5px 14px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    color: var(--text);
    border-left: 2px solid transparent;
    transition: background 0.1s;
  }
  .tree-row:hover { background: var(--surface2); }
  .tree-row.active { background: var(--surface2); border-left-color: var(--accent); color: var(--accent); }
  .tree-row .chev {
    width: 12px;
    color: var(--text-dim);
    font-size: 10px;
    transition: transform 0.15s;
    flex: none;
  }
  .tree-row.open .chev { transform: rotate(90deg); }
  .tree-row .icon { flex: none; font-size: 13px; }
  .tree-row .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tree-children {
    padding-left: 18px;
    max-height: 0;
    overflow: hidden;
  }
  .tree-children.open { max-height: none; }
  .tree-children .tree-row { font-size: 12.5px; font-weight: 500; color: var(--text-dim); padding-left: 10px; }
  .tree-children .tree-row:hover, .tree-children .tree-row.active { color: var(--text); }
  .tree-empty, .tree-loading {
    padding: 14px; font-size: 12px; color: var(--text-dim); text-align: center;
  }

  .sidebar-history {
    flex: none;
    height: 200px;
    border-top: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .history-scroll { flex: 1; overflow-y: auto; padding: 4px 8px 8px; }
  .history-item {
    padding: 7px 10px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
    color: var(--text-dim);
    transition: all 0.15s;
    border-left: 2px solid transparent;
    margin-bottom: 2px;
  }
  .history-item:hover {
    background: var(--surface2);
    color: var(--text);
    border-left-color: var(--accent);
  }
  .history-item .time { font-size: 10px; opacity: 0.7; }
  .history-item .sql {
    margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    font-family: var(--mono);
  }
  .history-empty { padding: 16px; color: var(--text-dim); font-size: 12px; text-align: center; }

  /* ── Main / editor ── */
  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    min-width: 0;
  }

  .tabstrip {
    flex: none;
    display: flex;
    align-items: stretch;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
  }
  .qtab {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 10px 0 14px;
    height: 38px;
    font-size: 13px;
    font-weight: 700;
    color: var(--text-dim);
    border-right: 1px solid var(--border);
    cursor: pointer;
    white-space: nowrap;
    position: relative;
  }
  .qtab.active {
    color: var(--text);
    background: var(--bg);
  }
  .qtab.active::after {
    content: '';
    position: absolute;
    left: 0; right: 0; bottom: -1px;
    height: 2px;
    background: var(--accent);
  }
  .qtab .close {
    width: 16px; height: 16px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 4px;
    font-size: 12px;
    color: var(--text-dim);
    visibility: hidden;
  }
  .qtab:hover .close { visibility: visible; }
  .qtab .close:hover { background: var(--surface3); color: var(--red); }
  .qtab-add {
    flex: none;
    width: 38px; height: 38px;
    display: flex; align-items: center; justify-content: center;
    color: var(--text-dim);
    cursor: pointer;
    font-size: 16px;
  }
  .qtab-add:hover { color: var(--accent); background: var(--surface2); }

  .editor-wrap {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .query-bar {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    flex: none;
  }
  .query-bar textarea {
    width: 100%;
    resize: vertical;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px 14px;
    color: var(--text);
    font-family: var(--mono);
    font-size: 13.5px;
    line-height: 1.5;
    outline: none;
    height: 280px;
    min-height: 80px;
    transition: border-color 0.2s;
    box-sizing: border-box;
  }
  .query-bar textarea:focus { border-color: var(--accent); }
  .query-bar textarea::placeholder { color: var(--text-dim); opacity: 0.6; }
  .query-bar .actions { display: flex; flex-direction: row; gap: 6px; }
  .query-bar .actions-row { display: flex; gap: 6px; }

  .result-tabs {
    display: flex;
    border-bottom: 1px solid var(--border);
    padding: 0 16px;
    flex: none;
  }
  .rtab {
    padding: 9px 14px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--text-dim);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: all 0.15s;
  }
  .rtab:hover { color: var(--text); }
  .rtab.active { color: var(--accent); border-bottom-color: var(--accent); }

  .result-area {
    flex: 1;
    padding: 16px;
    overflow: auto;
  }
  .result-area pre {
    font-family: var(--mono);
    font-size: 12.5px;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-all;
  }
  .result-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
    font-family: var(--mono);
  }
  .result-table th {
    text-align: left;
    padding: 8px 12px;
    background: var(--surface2);
    border-bottom: 2px solid var(--border);
    color: var(--text-dim);
    font-weight: 600;
    font-size: 11.5px;
    text-transform: uppercase;
    letter-spacing: 0.3px;
    position: sticky;
    top: 0;
    font-family: 'Nunito', sans-serif;
  }
  .result-table td {
    padding: 6px 12px;
    border-bottom: 1px solid var(--border);
    color: var(--text);
  }
  .result-table tr:hover td { background: var(--surface2); }
  .result-table td.num { text-align: right; color: var(--accent); }
  .result-table td.str { font-style: italic; color: var(--green); }

  .loading {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%;
    min-height: 160px;
    color: var(--text-dim);
    font-size: 13px;
    font-weight: 600;
  }
  .loading::before {
    content: '';
    width: 18px; height: 18px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-right: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .error-msg {
    color: var(--red);
    padding: 14px 16px;
    background: rgba(248, 113, 113, 0.1);
    border: 1px solid rgba(248, 113, 113, 0.25);
    border-radius: var(--radius);
    font-size: 13px;
    font-weight: 600;
  }
  .empty-msg {
    padding: 16px; color: var(--text-dim); font-size: 13px; font-weight: 600;
  }

  /* ── Status bar ── */
  .statusbar {
    flex: none;
    height: 26px;
    background: var(--surface);
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 14px;
    font-size: 11.5px;
    color: var(--text-dim);
    font-weight: 700;
  }
  .statusbar .left, .statusbar .right { display: flex; gap: 16px; align-items: center; }
  .statusbar .val { color: var(--accent); }

  /* ── Popover / modal ── */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(6, 7, 11, 0.6);
    display: none;
    align-items: flex-start;
    justify-content: center;
    padding-top: 90px;
    z-index: 200;
  }
  .overlay.show { display: flex; }
  .modal {
    width: 480px;
    max-width: 92vw;
    max-height: 70vh;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  .modal-header {
    padding: 12px 16px;
    background: var(--surface2);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-weight: 800;
    font-size: 13px;
  }
  .modal-header .close-x { cursor: pointer; color: var(--text-dim); font-size: 16px; }
  .modal-header .close-x:hover { color: var(--text); }
  .modal-body { padding: 14px 16px; overflow-y: auto; }

  .schema-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .schema-col {
    background: var(--surface2);
    border-radius: 6px;
    padding: 10px;
  }
  .schema-col .col-name { font-size: 13px; font-weight: 700; color: var(--text); }
  .schema-col .col-type { font-size: 11.5px; color: var(--text-dim); font-family: var(--mono); }

  .settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .setting-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 10px;
    background: var(--surface2);
    border-radius: 6px;
    font-size: 12px;
    gap: 8px;
  }
  .setting-item .key { color: var(--text-dim); font-weight: 600; }
  .setting-item .val { color: var(--accent); font-weight: 700; font-family: var(--mono); }

  /* ── Autocomplete ── */
  .autocomplete { position: relative; width: 100%; }
  .autocomplete-list {
    position: absolute;
    bottom: 100%;
    left: 0;
    right: 0;
    margin-bottom: 4px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    max-height: 200px;
    overflow-y: auto;
    z-index: 100;
    display: none;
  }
  .autocomplete-list.show { display: block; }
  .autocomplete-item {
    padding: 6px 12px;
    font-size: 12px;
    font-family: var(--mono);
    cursor: pointer;
    transition: background 0.1s;
    display: flex;
    justify-content: space-between;
  }
  .autocomplete-item:hover { background: var(--accent); color: white; }
  .autocomplete-item .type { color: var(--text-dim); font-family: 'Nunito', sans-serif; font-size: 10px; }
  .autocomplete-item:hover .type { color: rgba(255,255,255,0.7); }
</style>
</head>
<body>

<div class="app">
  <!-- Top bar -->
  <header class="topbar">
    <div class="brand">
      <img src="/favicon.ico" alt="" class="brand-logo"> Mnemo <span class="sub">DBMS</span>
    </div>
    <div class="topbar-right">
      <button class="icon-btn" title="Settings" onclick="openSettings()">⚙</button>
      <div class="pill count" id="historyPill"><span class="val">0</span> queries</div>
      <div class="pill" id="statusPill"><span class="dot" id="statusDot"></span> <span id="statusText">Connecting…</span></div>
      <button class="btn btn-run" onclick="executeActive()">▶ Run</button>
    </div>
  </header>

  <div class="body">
    <!-- Sidebar: DB tree + history -->
    <aside class="sidebar">
      <div class="sidebar-header">Databases</div>
      <input class="sidebar-search" id="dbFilter" placeholder="Filter databases…" oninput="renderDatabases()">
      <div class="tree-scroll" id="dbTree">
        <div class="tree-loading">Loading…</div>
      </div>
      <div class="sidebar-history">
        <div class="sidebar-header">History</div>
        <div class="history-scroll" id="historyList">
          <div class="history-empty">No queries yet</div>
        </div>
      </div>
    </aside>

    <!-- Main editor -->
    <main class="main">
      <div class="tabstrip" id="tabstrip"></div>

      <div class="editor-wrap">
        <div class="query-bar">
          <div class="autocomplete">
            <textarea id="queryInput" placeholder="SELECT * FROM table LIMIT 10"
                      autocomplete="off" spellcheck="false" oninput="onQueryInput()"></textarea>
            <div class="autocomplete-list" id="autocompleteList"></div>
          </div>
          <div class="actions">
            <div class="actions-row">
              <button class="btn btn-run" onclick="executeActive()">▶ Run</button>
            </div>
            <div class="actions-row">
              <button class="btn btn-secondary" onclick="clearResult()">Clear</button>
              <button class="btn btn-secondary" onclick="formatSQL()">Format</button>
            </div>
          </div>
        </div>

        <div class="result-tabs">
          <div class="rtab active" data-rtab="result" onclick="switchResultTab('result')">Result</div>
          <div class="rtab" data-rtab="json" onclick="switchResultTab('json')">JSON</div>
          <div class="rtab" data-rtab="explain" onclick="switchResultTab('explain')">EXPLAIN</div>
        </div>
        <div class="result-area" id="resultArea">
          <div class="loading">Waiting for query…</div>
        </div>
      </div>
    </main>
  </div>

  <!-- Status bar -->
  <footer class="statusbar">
    <div class="left">
      <span>Mnemo: <span class="val">0.1.0</span></span>
      <span>Dialect: <span class="val">MnemoSQL</span></span>
    </div>
    <div class="right" id="statusRight">
      <span>Rows: <span class="val">–</span></span>
      <span>Duration: <span class="val">–</span></span>
      <span>Bytes Read: <span class="val">–</span></span>
    </div>
  </footer>
</div>

<!-- Settings modal -->
<div class="overlay" id="settingsOverlay" onclick="if(event.target===this) closeSettings()">
  <div class="modal">
    <div class="modal-header">
      Settings
      <span class="close-x" onclick="closeSettings()">✕</span>
    </div>
    <div class="modal-body">
      <div class="settings-grid" id="settingsArea">
        <div class="loading">Loading…</div>
      </div>
    </div>
  </div>
</div>

<!-- Schema modal -->
<div class="overlay" id="schemaOverlay" onclick="if(event.target===this) closeSchema()">
  <div class="modal">
    <div class="modal-header">
      <span id="schemaTitle">Schema</span>
      <span class="close-x" onclick="closeSchema()">✕</span>
    </div>
    <div class="modal-body">
      <div class="schema-grid" id="schemaArea"></div>
    </div>
  </div>
</div>

<script>
const API = '/';

// ── Tab state ──
let tabs = [];
let activeTabId = null;
let nextTabId = 1;

function newTab(query = '') {
  const tab = {
    id: nextTabId++,
    title: `Custom SQL ${nextTabId - 1}`,
    query,
    resultTab: 'result',
    lastResult: null,
    lastError: null,
  };
  tabs.push(tab);
  activeTabId = tab.id;
  renderTabs();
  renderActiveTab();
  return tab;
}

function activeTab() {
  return tabs.find(t => t.id === activeTabId);
}

function selectTab(id) {
  saveActiveQueryText();
  activeTabId = id;
  renderTabs();
  renderActiveTab();
}

function closeTab(id, evt) {
  if (evt) evt.stopPropagation();
  const idx = tabs.findIndex(t => t.id === id);
  if (idx === -1 || tabs.length === 1) return;
  tabs.splice(idx, 1);
  if (activeTabId === id) {
    activeTabId = tabs[Math.max(0, idx - 1)].id;
  }
  renderTabs();
  renderActiveTab();
}

function saveActiveQueryText() {
  const t = activeTab();
  if (t) t.query = document.getElementById('queryInput').value;
}

function renderTabs() {
  const strip = document.getElementById('tabstrip');
  let html = tabs.map(t => `
    <div class="qtab ${t.id === activeTabId ? 'active' : ''}" onclick="selectTab(${t.id})">
      <span>${escapeHtml(t.title)}</span>
      <span class="close" onclick="closeTab(${t.id}, event)">✕</span>
    </div>
  `).join('');
  html += `<div class="qtab-add" onclick="newTab()" title="New query tab">+</div>`;
  strip.innerHTML = html;
}

function renderActiveTab() {
  const t = activeTab();
  if (!t) return;
  document.getElementById('queryInput').value = t.query;
  document.querySelectorAll('.rtab').forEach(el => el.classList.toggle('active', el.dataset.rtab === t.resultTab));
  if (t.lastError) {
    renderErrorResult(t.lastError, false);
  } else if (t.lastResult) {
    renderQueryResult(t.lastResult, false);
  } else {
    document.getElementById('resultArea').innerHTML = '<div class="loading">Waiting for query…</div>';
    setStatusRight(null);
  }
}

// ── Query Execution ──
async function executeActive() {
  saveActiveQueryText();
  const t = activeTab();
  const query = t.query.trim();
  if (!query) return;

  const resultArea = document.getElementById('resultArea');
  resultArea.innerHTML = '<div class="loading">Executing…</div>';

  try {
    const resp = await fetch(`${API}query?query=${encodeURIComponent(query)}&format=JSON`);
    const data = await resp.json();

    if (data.error) {
      t.lastError = data.error;
      t.lastResult = null;
      renderErrorResult(data.error, true);
      return;
    }

    t.lastResult = data;
    t.lastError = null;
    addHistory(query, data);
    renderQueryResult(data, true);
  } catch (err) {
    t.lastError = `Connection error: ${err.message}`;
    t.lastResult = null;
    renderErrorResult(t.lastError, true);
  }
}

function renderErrorResult(message, updateStatus) {
  document.getElementById('resultArea').innerHTML = `<div class="error-msg">${escapeHtml(message)}</div>`;
  if (updateStatus) setStatusRight(null);
}

function renderQueryResult(data, updateStatus) {
  const resultArea = document.getElementById('resultArea');
  const t = activeTab();

  if (t.resultTab === 'json') {
    resultArea.innerHTML = `<pre>${escapeHtml(JSON.stringify(data, null, 2))}</pre>`;
  } else if (t.resultTab === 'explain') {
    resultArea.innerHTML = '<div class="loading">Explaining…</div>';
    explainQuery();
  } else {
    if (!data.rows || !data.data || data.data.length === 0) {
      resultArea.innerHTML = `<div class="empty-msg">No rows returned.</div>`;
    } else {
      let html = '<table class="result-table"><thead><tr>';
      data.columns.forEach(col => { html += `<th>${escapeHtml(col)}</th>`; });
      html += '</tr></thead><tbody>';
      data.data.forEach(row => {
        if (typeof row === 'string') {
          html += `<tr><td colspan="${data.columns.length}" style="color:var(--text-dim);font-style:italic;">${escapeHtml(row)}</td></tr>`;
          return;
        }
        html += '<tr>';
        row.forEach(cell => {
          const cls = typeof cell === 'number' ? 'num' : typeof cell === 'string' ? 'str' : '';
          const val = cell === null ? 'null' : typeof cell === 'boolean' ? (cell ? 'true' : 'false') : String(cell);
          html += `<td class="${cls}">${escapeHtml(val)}</td>`;
        });
        html += '</tr>';
      });
      html += '</tbody></table>';
      resultArea.innerHTML = html;
    }
  }

  if (updateStatus) setStatusRight(data);
}

function setStatusRight(data) {
  const right = document.getElementById('statusRight');
  if (!data) {
    right.innerHTML = `<span>Rows: <span class="val">–</span></span><span>Duration: <span class="val">–</span></span><span>Bytes Read: <span class="val">–</span></span>`;
    return;
  }
  right.innerHTML = `
    <span>Rows: <span class="val">${data.rows ?? 0}</span></span>
    <span>Duration: <span class="val">${(data.duration_ms ?? 0).toFixed ? data.duration_ms.toFixed(2) : data.duration_ms}ms</span></span>
    <span>Bytes Read: <span class="val">${(data.bytes_read || 0).toLocaleString()}</span></span>`;
}

// ── EXPLAIN ──
async function explainQuery() {
  const t = activeTab();
  const query = t.query.trim();
  if (!query) return;

  const resultArea = document.getElementById('resultArea');
  try {
    const resp = await fetch(`${API}query?query=EXPLAIN+${encodeURIComponent(query)}`);
    const text = await resp.text();
    resultArea.innerHTML = `<pre>${escapeHtml(text)}</pre>`;
  } catch (err) {
    resultArea.innerHTML = `<div class="error-msg">${escapeHtml(err.message)}</div>`;
  }
}

// ── Result tabs ──
function switchResultTab(tab) {
  const t = activeTab();
  t.resultTab = tab;
  document.querySelectorAll('.rtab').forEach(el => el.classList.toggle('active', el.dataset.rtab === tab));

  if (tab === 'result') {
    if (t.lastError) renderErrorResult(t.lastError, false);
    else if (t.lastResult) renderQueryResult(t.lastResult, false);
    else document.getElementById('resultArea').innerHTML = '<div class="loading">Waiting for query…</div>';
  } else if (tab === 'json') {
    if (t.lastResult) renderQueryResult(t.lastResult, false);
    else document.getElementById('resultArea').innerHTML = '<div class="empty-msg">Run a query first.</div>';
  } else if (tab === 'explain') {
    if (t.query.trim()) { document.getElementById('resultArea').innerHTML = '<div class="loading">Explaining…</div>'; explainQuery(); }
    else document.getElementById('resultArea').innerHTML = '<div class="empty-msg">Run a query first.</div>';
  }
}

// ── Clear / Format ──
function clearResult() {
  const t = activeTab();
  t.lastResult = null;
  t.lastError = null;
  document.getElementById('resultArea').innerHTML = '<div class="loading">Waiting for query…</div>';
  setStatusRight(null);
}

function formatSQL() {
  const input = document.getElementById('queryInput');
  let sql = input.value;
  const keywords = ['SELECT', 'FROM', 'WHERE', 'JOIN', 'LEFT', 'RIGHT', 'INNER', 'OUTER',
                    'GROUP', 'ORDER', 'HAVING', 'LIMIT', 'OFFSET', 'UNION', 'INSERT', 'UPDATE',
                    'DELETE', 'CREATE', 'DROP', 'ALTER', 'SET', 'VALUES', 'INTO', 'ON', 'AND', 'OR'];
  keywords.forEach(kw => {
    const regex = new RegExp(`\\b${kw}\\b`, 'gi');
    sql = sql.replace(regex, '\n' + kw);
  });
  input.value = sql.replace(/^\n+/, '').trim();
  saveActiveQueryText();
}

// ── Databases / tables tree ──
let allDatabases = [];
let dbTables = {};       // db -> [table, ...] (lazily loaded)
let expandedDbs = new Set();

async function loadDatabases() {
  try {
    const resp = await fetch(`${API}databases`);
    const data = await resp.json();
    allDatabases = data.databases || [];
    setConnected(true);
    renderDatabases();
  } catch (err) {
    setConnected(false);
    document.getElementById('dbTree').innerHTML = `<div class="error-msg">${escapeHtml(err.message)}</div>`;
  }
}

function setConnected(ok) {
  document.getElementById('statusDot').classList.toggle('off', !ok);
  document.getElementById('statusText').textContent = ok ? 'Connected' : 'Disconnected';
}

function renderDatabases() {
  const filter = (document.getElementById('dbFilter').value || '').toLowerCase();
  const dbs = allDatabases.filter(db => db.toLowerCase().includes(filter));
  const tree = document.getElementById('dbTree');

  if (!dbs.length) {
    tree.innerHTML = '<div class="tree-empty">No databases</div>';
    return;
  }

  tree.innerHTML = dbs.map(db => {
    const open = expandedDbs.has(db);
    const tables = dbTables[db];
    let childrenHtml;
    if (!open) {
      childrenHtml = '';
    } else if (!tables) {
      childrenHtml = '<div class="tree-loading">Loading…</div>';
    } else if (!tables.length) {
      childrenHtml = '<div class="tree-empty">No tables</div>';
    } else {
      childrenHtml = tables.map(tbl => `
        <div class="tree-row" onclick="onTableClick('${escapeAttr(db)}','${escapeAttr(tbl)}')">
          <span class="chev"></span><span class="icon">▤</span><span class="name">${escapeHtml(tbl)}</span>
        </div>
      `).join('');
    }
    return `
      <div class="tree-node">
        <div class="tree-row ${open ? 'open' : ''}" onclick="toggleDb('${escapeAttr(db)}')">
          <span class="chev">▶</span><span class="icon">🗄</span><span class="name">${escapeHtml(db)}</span>
        </div>
        <div class="tree-children ${open ? 'open' : ''}">${childrenHtml}</div>
      </div>`;
  }).join('');
}

async function toggleDb(db) {
  if (expandedDbs.has(db)) {
    expandedDbs.delete(db);
    renderDatabases();
    return;
  }
  expandedDbs.add(db);
  renderDatabases();
  if (!dbTables[db]) {
    try {
      const resp = await fetch(`${API}tables/${encodeURIComponent(db)}`);
      const data = await resp.json();
      dbTables[db] = data.tables || [];
    } catch (err) {
      dbTables[db] = [];
    }
    renderDatabases();
  }
}

function onTableClick(db, table) {
  const t = activeTab();
  t.query = `SELECT * FROM ${db}.${table} LIMIT 100`;
  document.getElementById('queryInput').value = t.query;
  loadSchema(db, table);
}

async function loadSchema(db, table) {
  document.getElementById('schemaTitle').textContent = `${db}.${table}`;
  document.getElementById('schemaArea').innerHTML = '<div class="loading">Loading…</div>';
  openSchema();
  try {
    const resp = await fetch(`${API}schema/${encodeURIComponent(db)}/${encodeURIComponent(table)}`);
    const data = await resp.json();
    renderSchema(data.columns || []);
  } catch (err) {
    document.getElementById('schemaArea').innerHTML = `<div class="error-msg">${escapeHtml(err.message)}</div>`;
  }
}

function renderSchema(columns) {
  const area = document.getElementById('schemaArea');
  if (!columns.length) {
    area.innerHTML = '<div class="empty-msg">No columns</div>';
    return;
  }
  area.innerHTML = columns.map(col => `
    <div class="schema-col">
      <div class="col-name">${escapeHtml(col.name)}</div>
      <div class="col-type">${escapeHtml(col.type)}</div>
    </div>
  `).join('');
}

function openSchema() { document.getElementById('schemaOverlay').classList.add('show'); }
function closeSchema() { document.getElementById('schemaOverlay').classList.remove('show'); }

// ── Settings ──
async function loadSettings() {
  try {
    const resp = await fetch(`${API}settings`);
    const data = await resp.json();
    renderSettings(data.settings || {});
  } catch (err) {
    document.getElementById('settingsArea').innerHTML = `<div class="error-msg">${escapeHtml(err.message)}</div>`;
  }
}

function renderSettings(settings) {
  const area = document.getElementById('settingsArea');
  const entries = Object.entries(settings);
  if (!entries.length) {
    area.innerHTML = '<div class="empty-msg">No settings</div>';
    return;
  }
  area.innerHTML = entries.map(([key, val]) => {
    const displayVal = typeof val === 'object' ? JSON.stringify(val) : String(val);
    return `<div class="setting-item"><span class="key">${escapeHtml(key)}</span><span class="val">${escapeHtml(displayVal)}</span></div>`;
  }).join('');
}

function openSettings() { document.getElementById('settingsOverlay').classList.add('show'); }
function closeSettings() { document.getElementById('settingsOverlay').classList.remove('show'); }

// ── History (global, across tabs) ──
let queryHistory = [];

function addHistory(query, data) {
  queryHistory.unshift({ query, time: new Date(), data });
  updateHistory();
}

function updateHistory() {
  document.getElementById('historyPill').innerHTML = `<span class="val">${queryHistory.length}</span> queries`;
  const list = document.getElementById('historyList');
  if (!queryHistory.length) {
    list.innerHTML = '<div class="history-empty">No queries yet</div>';
    return;
  }
  list.innerHTML = queryHistory.slice(0, 30).map((item, i) => `
    <div class="history-item" onclick="loadFromHistory(${i})">
      <div class="time">${item.time.toLocaleTimeString()}</div>
      <div class="sql">${escapeHtml(item.query)}</div>
    </div>
  `).join('');
}

function loadFromHistory(i) {
  const t = activeTab();
  t.query = queryHistory[i].query;
  document.getElementById('queryInput').value = t.query;
  executeActive();
}

// ── Helpers ──
function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str ?? '';
  return div.innerHTML;
}
function escapeAttr(str) {
  return String(str).replace(/'/g, "\\'");
}

// ── SQL Autocomplete ──
const sqlKeywords = ['SELECT', 'FROM', 'WHERE', 'JOIN', 'LEFT JOIN', 'RIGHT JOIN', 'INNER JOIN',
                     'GROUP BY', 'ORDER BY', 'HAVING', 'LIMIT', 'OFFSET', 'UNION', 'INSERT INTO',
                     'UPDATE', 'DELETE FROM', 'CREATE TABLE', 'DROP TABLE', 'ALTER TABLE',
                     'COUNT', 'SUM', 'AVG', 'MIN', 'MAX', 'AS', 'AND', 'OR', 'NOT', 'IN',
                     'LIKE', 'BETWEEN', 'IS NULL', 'IS NOT NULL', 'DISTINCT', 'CASE', 'WHEN',
                     'THEN', 'ELSE', 'END', 'ON', 'SET', 'VALUES', 'INTO'];

function onQueryInput() {
  saveActiveQueryText();
  const input = document.getElementById('queryInput');
  const autocompleteList = document.getElementById('autocompleteList');
  const val = input.value;
  const cursorPos = input.selectionStart;
  const beforeCursor = val.substring(0, cursorPos);
  const lastWord = beforeCursor.match(/\b(\w+)$/);

  if (!lastWord) {
    autocompleteList.classList.remove('show');
    return;
  }
  const query = lastWord[1].toUpperCase();
  const matches = sqlKeywords.filter(k => k.startsWith(query) && k !== query);

  if (matches.length) {
    autocompleteList.innerHTML = matches.map(m =>
      `<div class="autocomplete-item" onmousedown="insertWord('${m}')">${m}<span class="type">keyword</span></div>`
    ).join('');
    autocompleteList.classList.add('show');
  } else {
    autocompleteList.classList.remove('show');
  }
}

function insertWord(word) {
  const input = document.getElementById('queryInput');
  const autocompleteList = document.getElementById('autocompleteList');
  const val = input.value;
  const cursorPos = input.selectionStart;
  const beforeCursor = val.substring(0, cursorPos);
  const lastWord = beforeCursor.match(/\b(\w+)$/);
  if (lastWord) {
    const start = cursorPos - lastWord[0].length;
    input.value = val.substring(0, start) + word + val.substring(cursorPos);
    input.setSelectionRange(start + word.length, start + word.length);
  }
  autocompleteList.classList.remove('show');
  input.focus();
  saveActiveQueryText();
}

document.addEventListener('click', (e) => {
  if (!e.target.closest('.autocomplete')) {
    document.getElementById('autocompleteList').classList.remove('show');
  }
});

document.getElementById('queryInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
    e.preventDefault();
    executeActive();
  }
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { closeSettings(); closeSchema(); }
});

// ── Init ──
newTab();
loadDatabases();
loadSettings();
updateHistory();
</script>
